services:
  db:
    image: postgres:16-alpine
    container_name: vlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vlab_solicitacoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: vlab-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vlab_solicitacoes
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:8000"
    command: sh -c "composer install --no-interaction --prefer-dist --no-progress && php artisan key:generate --force && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  postgres_data:
