services:
  db:
    image: postgres:16-alpine
    container_name: vlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vlab_solicitacoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vlab_solicitacoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: vlab-backend
    working_dir: /var/www/html
    volumes:
      - ./docs:/var/www/docs:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OPENAPI_PATH: /var/www/docs/openapi.yaml
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vlab_solicitacoes
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: 4
      PHP_OPCACHE_ENABLE_CLI: 1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);\""]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    command: sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --no-progress; fi && php artisan key:generate --force && php artisan migrate --force && cd public && php -S 0.0.0.0:8000 -t . ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"

  frontend:
    build:
      context: ./frontend
    container_name: vlab-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://127.0.0.1:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
